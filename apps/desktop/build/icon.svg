<!--
  StageCue's app icon: the logo mark (src/renderer/src/ui/logo.tsx) on Apple's
  1024 icon grid (an 824 tile, inset 100, with a soft shadow). Colours are the
  app's tokens: cue oklch(0.8 0.14 158), cue-strong oklch(0.86 0.13 158), cue-ink
  oklch(0.2 0.04 160). Render to icon.png with `pnpm --filter @stagecue/desktop icon`.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: oklch(0.86 0.13 158)" />
      <stop offset="1" style="stop-color: oklch(0.74 0.15 158)" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#shadow)" />
  <!-- The mark's 32-unit grid, scaled to the 824 tile. -->
  <g transform="translate(100 100) scale(25.75)" style="fill: oklch(0.2 0.04 160)">
    <rect x="8" y="8.5" width="16" height="5" rx="1.5" />
    <rect x="11.5" y="16" width="9" height="2.5" rx="1.25" opacity="0.6" />
    <rect x="6" y="23" width="20" height="2.5" rx="1.25" opacity="0.28" />
    <rect x="6" y="23" width="13.5" height="2.5" rx="1.25" />
  </g>
</svg>
